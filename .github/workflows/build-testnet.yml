name: Build Mycelium Testnet APK

on:
  workflow_dispatch: # Allows you to trigger the build manually with a button click

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout main repository
      uses: actions/checkout@v4

    - name: Checkout submodules recursively
      run: |
        git submodule update --init --recursive

    - name: Set up Java Development Kit (JDK)
      uses: actions/setup-java@v4
      with:
        java-version: '17' # Java 17 is typical for Android SDK builds in recent Gradle versions
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for Gradle wrapper
      run: chmod +x gradlew

    - name: Compile Testnet Release APK
      run: ./gradlew clean mbw::assembleBtctestnetRelease --no-daemon

    - name: Upload Finished APK to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: Mycelium-Testnet3-Unsigned-APK
        path: mbw/build/outputs/apk/btctestnet/release/*.apk
